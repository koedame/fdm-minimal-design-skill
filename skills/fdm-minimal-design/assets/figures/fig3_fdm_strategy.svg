<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="1360" height="940" role="img"><title>Part split and print orientation for FDM</title><style>
text{font-family:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.leader{stroke:#888780;stroke-width:0.6;stroke-dasharray:3 3;fill:none}
</style>
<rect width="100%" height="100%" fill="#FFFFFF"/><text class="th" x="40" y="50">Part split and print orientation (grey band = build plate)</text>
<path d="M60 170 V110 H160 V118 H68 V162 H160 V170 Z" fill="#ECEAE4" stroke="#888780" stroke-width="0.5"/>
<rect x="50" y="170" width="120" height="6" fill="#B4B2A9"/>
<text class="th" x="110" y="200" text-anchor="middle">Housing (sleeve)</text>
<text class="ts" x="110" y="220" text-anchor="middle">Bottom down</text>
<rect x="210" y="162" width="100" height="8" fill="#D9D7D0" stroke="#888780" stroke-width="0.5"/>
<rect x="200" y="170" width="120" height="6" fill="#B4B2A9"/>
<text class="th" x="260" y="200" text-anchor="middle">Front plate</text>
<text class="ts" x="260" y="220" text-anchor="middle">Visible face down</text>
<rect x="380" y="150" width="20" height="20" fill="#EF9F27"/>
<rect x="420" y="150" width="20" height="20" fill="#ECEAE4" stroke="#888780" stroke-width="0.5"/>
<rect x="350" y="170" width="120" height="6" fill="#B4B2A9"/>
<text class="th" x="410" y="200" text-anchor="middle">Buttons</text>
<text class="ts" x="410" y="220" text-anchor="middle">Face down, colour-coded</text>
<rect x="530" y="144" width="60" height="26" fill="#ECEAE4" stroke="#888780" stroke-width="0.5"/>
<line x1="545" y1="144" x2="545" y2="150" stroke="#3A3A38" stroke-width="1.5"/>
<line x1="575" y1="144" x2="575" y2="150" stroke="#3A3A38" stroke-width="1.5"/>
<rect x="500" y="170" width="120" height="6" fill="#B4B2A9"/>
<text class="th" x="560" y="200" text-anchor="middle">Stepped dial</text>
<text class="ts" x="560" y="220" text-anchor="middle">Exception: face up</text>
<text class="th" x="40" y="260">Front plate section</text>
<text class="ts" x="127" y="300" text-anchor="middle">Holes Ø2.2–2.5</text>
<line class="leader" x1="127" y1="306" x2="127" y2="328"/>
<text class="ts" x="227" y="300" text-anchor="middle">Wall ≥ 0.8 mm</text>
<line class="leader" x1="227" y1="306" x2="227" y2="328"/>
<polygon points="70,330 120,330 120,360 80,360 70,350" fill="#D9D7D0" stroke="#888780" stroke-width="0.5"/>
<rect x="134" y="330" width="26" height="30" fill="#D9D7D0" stroke="#888780" stroke-width="0.5"/>
<rect x="174" y="330" width="26" height="30" fill="#D9D7D0" stroke="#888780" stroke-width="0.5"/>
<rect x="214" y="330" width="26" height="30" fill="#D9D7D0" stroke="#888780" stroke-width="0.5"/>
<rect x="254" y="330" width="46" height="30" fill="#D9D7D0" stroke="#888780" stroke-width="0.5"/>
<rect x="262" y="354" width="30" height="6" fill="#8C8C87"/>
<rect x="50" y="360" width="270" height="8" fill="#B4B2A9"/>
<line class="leader" x1="73" y1="354" x2="73" y2="380"/><circle cx="73" cy="354" r="2" fill="#888780"/>
<text class="ts" x="60" y="394">C0.6 chamfer</text>
<line class="leader" x1="277" y1="358" x2="277" y2="380"/><circle cx="277" cy="358" r="2" fill="#888780"/>
<text class="ts" x="320" y="394" text-anchor="end">Layers 1–2 in label colour</text>
<text class="ts" x="60" y="430">The bottom side becomes the product front</text>
<text class="th" x="360" y="260">Part joint (reveal line)</text>
<text class="ts" x="505" y="282" text-anchor="middle">Front side</text>
<path d="M390 290 H410 V380 H600 V290 H620 V400 H390 Z" fill="#ECEAE4" stroke="#888780" stroke-width="0.5"/>
<rect x="416" y="290" width="178" height="84" fill="#D9D7D0" stroke="#888780" stroke-width="0.5"/>
<text class="ts" x="505" y="336" text-anchor="middle">Front plate</text>
<line class="leader" x1="413" y1="330" x2="413" y2="418"/><circle cx="413" cy="330" r="2" fill="#888780"/>
<text class="ts" x="360" y="434">The gap itself is the reveal line</text>
<text class="ts" x="360" y="454">0.25 mm per side (exaggerated)</text></svg>
