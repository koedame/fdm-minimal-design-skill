name: CI

# Builds every sample and model with the pinned CadQuery environment and runs
# the same checks the skill asks for (references/04_review.md, steps 4 and 5),
# builds the website (which holds the HTML viewer of every sample and model),
# then packages the skill.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Samples, models and skill bundle
    # A private repository can run this on a self-hosted runner named by the LINUX_RUNNER variable. A public one always
    # uses the GitHub-hosted runner, so that pull requests from forks never reach a self-hosted machine.
    runs-on: ${{ github.event.repository.private && vars.LINUX_RUNNER || 'ubuntu-latest' }}
    # The limit is there to stop a hung build. A normal run builds every model twice (check, website) and grows by
    # about a minute per ten models; with 80 it took 19.5 of the old 20, so the limit leaves room for growth.
    # The self-hosted runner is slower, so it gets twice as long.
    timeout-minutes: ${{ vars.LINUX_RUNNER && github.event.repository.private && 80 || 40 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # VTK renders off-screen through OSMesa when there is no display.
      # The self-hosted runner has no sudo and comes with OSMesa installed.
      - name: Install OSMesa for off-screen rendering
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libosmesa6

      - name: Install the pinned environment
        run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m pytest -q

      - name: Viewer input tests (wheel and trackpad events per browser)
        run: node --test tests/js/*.test.mjs

      - name: Verify the 12 samples (validity, interference, watertight, bed, ground contact)
        run: python skills/fdm-minimal-design/scripts/verify.py --all

      - name: Verify the hinge of 07_hinged_case over its opening range
        run: >-
          python skills/fdm-minimal-design/scripts/verify.py 07_hinged_case
          --hinge "lid:base:0,32,24:1,32,24:0,-30,-60,-90,-110"

      - name: Verify the template for new objects
        run: >-
          python skills/fdm-minimal-design/scripts/verify.py pen_cup
          --module skills/fdm-minimal-design/scripts/template_new_object.py

      - name: Check the models in models/
        run: python tools/models.py check

      - name: Render the samples
        run: >-
          python skills/fdm-minimal-design/scripts/render.py --all
          --out build/previews --sheet build/previews/overview.png

      - name: Build the website (samples and models, with their viewers and downloads)
        run: python tools/build_site.py --out build/site

      - name: Build the skill bundle
        run: python tools/build_skill.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fdm-minimal-design
          path: |
            dist/fdm-minimal-design.skill
            build/previews/
            build/site/
          retention-days: 14
